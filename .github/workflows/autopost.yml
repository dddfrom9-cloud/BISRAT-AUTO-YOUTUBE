
name: BISRAT AUTO YOUTUBE

on:
  schedule:
    - cron: "17 21,3,9,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bisrat-youtube-uploader
  cancel-in-progress: false

jobs:
  upload-next-video:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Get uploader
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: |
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Upload next video
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DEFAULT_DESCRIPTION: ${{ vars.DEFAULT_DESCRIPTION }}
          DEFAULT_TAGS: ${{ vars.DEFAULT_TAGS }}
          YOUTUBE_CATEGORY_ID: ${{ vars.YOUTUBE_CATEGORY_ID }}
        run: python main.py

      - name: Save upload history
        run: |
          git config user.name "bisrat-auto-youtube"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update upload history"
          git push
